<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./public/calculator.js" type="module" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="main">
            <div class="result-field">
               <textarea class="result" readonly></textarea>
            </div>
            <div class="buttons">
                <button value="del" class="operations">Del</button>
                <button value="reset" class="operations">AC</button>
                <button value="%" class="operations">%</button>
                <button value="/" class="operations">/</button>
                <button value="7">7</button>
                <button value="8">8</button>
                <button value="9">9</button>
                <button value="*" class="operations">X</button>
                <button value="4">4</button>
                <button value="5">5</button>
                <button value="6">6</button>
                <button value="-" class="operations">-</button>
                <button value="1">1</button>
                <button value="2">2</button>
                <button value="3">3</button>
                <button value="+" class="operations">+</button>
                <button value="0" class="zero">0</button>
                <button value=".">.</button>
                <button value="=" class="equal">=</button>
            </div>
        </div>
    </div>
</body>
</html>
