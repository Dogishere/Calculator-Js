<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./src/calculator.ts" type="module" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="main">
            <div class="hr-line">
                <hr>
            </div>
            <div class="result-field">
               <textarea class="result" readonly></textarea>
            </div>
            <div class="buttons">
                <button value="del" class="delete">DEL</button>
                <button value="reset" class="reset">AC</button>
                <button value="%" class="operations">%</button>
                <button value="/" class="operations">/</button>
                <button value="7" class="values">7</button>
                <button value="8" class="values">8</button>
                <button value="9" class="values">9</button>
                <button value="*" class="operations">x</button>
                <button value="4" class="values">4</button>
                <button value="5" class="values">5</button>
                <button value="6" class="values">6</button>
                <button value="-" class="operations">-</button>
                <button value="1" class="values">1</button>
                <button value="2" class="values">2</button>
                <button value="3" class="values">3</button>
                <button value="+" class="operations">+</button>
                <button value="0" class="zero">0</button>
                <button value="." class="values">.</button>
                <button value="=" class="equal">=</button>
            </div>
        </div>
    </div>
</body>
</html>
